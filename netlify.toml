# Portability insurance. Plain static output means Netlify needs no code change.
# The header rules here mirror public/_headers and vercel.json exactly -- if you
# edit one, edit all three. See public/_headers for the caching rationale.
[build]
  command = "npm run build"
  publish = "dist"

# --- Immutable, content-hashed or never-changing -----------------------------

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Stable paths, unstable content ------------------------------------------

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# --- Crawler-facing files: short edge TTL so a fix propagates fast -----------

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=3600"

[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=3600"

# --- Everything else: HTML, plus the site-wide security headers --------------
#
# The X-Robots-Tag line is the PRE-LAUNCH LOCKDOWN. Delete it on launch, in all
# three host configs, at the same time as flipping DISCOVERABLE in
# src/lib/site.ts. See the checklist in that file.

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=86400, stale-while-revalidate=604800"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"
