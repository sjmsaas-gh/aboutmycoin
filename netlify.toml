# Portability insurance. Plain static output means Netlify needs no code change.
# The header rules here mirror public/_headers and vercel.json exactly -- if you
# edit one, edit all three. See public/_headers for the caching rationale.
[build]
  command = "npm run build"
  publish = "dist"

# --- Immutable, content-hashed or never-changing -----------------------------

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Stable paths, unstable content ------------------------------------------

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# --- Crawler-facing files: short edge TTL so a fix propagates fast -----------

# The one endpoint on this site whose answer is meant to be cached, and the one
# document allowed to be younger than the HTML around it: an hour at the edge
# against a day for everything else. That is what lets a spot price change
# without a deploy -- see src/lib/spot.ts. The value must match the
# Cache-Control that src/server/spot.ts sets on the response itself, and the
# rules in vercel.json and public/_headers.
#
# It is also the one rule here with no `must-revalidate` on it, deliberately:
# that directive forbids serving a stale response and `stale-while-revalidate`
# exists to allow one, so a strict CDN resolves the contradiction by dropping
# the SWR. Here the SWR is the point -- an older price, labelled with its date,
# beats no price.
[[headers]]
  for = "/api/spot"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400"

# Every other endpoint takes a key, a token or a message. None of those may sit
# in a shared cache, and the catch-all below would otherwise hand them the
# HTML rule.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=3600"

[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=3600"

# --- Everything else: HTML, plus the site-wide security headers --------------

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=86400, stale-while-revalidate=604800"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
